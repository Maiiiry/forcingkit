[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forcingkit"
version = "0.9.0"
description = "Spatiotemporal forcing for computational Earth-system models: selects, regrids and serves model-ready time series with provenance."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Daniel Fry", email = "dfry@lhzn.io" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "cfgrib>=0.9.15.1",
    "eccodes>=2.46.0",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "jinja2>=3.0.0",
    "pydap>=3.5.8",
    "pyproj>=3.7.2",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "s3fs>=2026.2.0",
    "scipy>=1.17.1",
    "uvicorn>=0.41.0",
    "xarray>=2026.2.0",
    "zarr>=3.1.5",
    "bottleneck>=1.6.0",
    "utide>=0.3.1",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "dask[array]>=2026.3.0",
    "cftime>=1.6.5",
    "matplotlib>=3.10.9",
    "pillow>=10.0",
]

[tool.hatch.build.targets.wheel]
# The library and the FastAPI service that serves it (forcingkit_serve.main:app).
packages = ["src/forcingkit", "service/forcingkit_serve"]

[project.urls]
Documentation = "https://forcingkit.docs.lhzn.io"
Issues = "https://github.com/lhzn-io/forcingkit/issues"
Source = "https://github.com/lhzn-io/forcingkit"

[tool.ruff]
# This project previously had no [tool.ruff] section, so it inherited whatever
# rule set the installed ruff happened to default to. Ruff 0.16 broadened those
# defaults, which took the tree from 3 findings to 309 overnight without a line
# of code changing. Selecting explicitly pins the standard to the ruff version,
# so upgrading the tool no longer silently redefines what "clean" means.
#
# E4/E7/E9 + F reproduces the rule set this code has actually been linted
# against to date. Broadening it (topobathykit additionally selects I, B, UP, N,
# SIM and RUF) is a deliberate decision to take separately, with the resulting
# findings reviewed rather than absorbed by a version bump.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# The project declares no [build-system], so `uv sync` never installs
# forcingkit (src/) or forcingkit_serve (service/) into the venv. Tests import
# both directly, so put each source root on the path for the test session.
pythonpath = ["src", "service"]
markers = [
    "integration: marks tests as integration tests",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3,<3",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.9",
]
